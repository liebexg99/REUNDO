<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Reundo — Footer</title>
  <link rel="stylesheet" href="../css/stylefooter.css">
</head>
<body>
  <footer class="footer">
    <div class="brand-logos" aria-label="Game and publisher logos">
      <div class="logo-slot">
        <img src="" alt="Game logo — add your image in footer.html">
      </div>
      <span class="brand-divider" aria-hidden="true"></span>
      <div class="logo-slot publisher-slot">
        <img src="" alt="Publisher logo — add your image in footer.html">
      </div>
    </div>

    <nav class="footer-links" aria-label="Footer links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
      <a href="#">About Us</a>
      <a href="#">Contact Us</a>
      <a href="#">Help Center</a>
    </nav>

    <div class="rating-slot" aria-label="Game rating image placeholder">
      <span>GAME RATING</span>
      <strong>ADD RATING IMAGE HERE</strong>
    </div>

    <p class="trademark">
      All trademarks, game titles, and platform logos are the property of their respective owners.
    </p>

    <div class="publisher-logo-slot">
      <img src="" alt="Publisher logo — add your image in footer.html">
    </div>

    <p class="copyright">Copyright © REUNDO. All Rights Reserved.</p>
  </footer>
  <script src="../script/frame-scroll.js"></script>
</body>
</html>
